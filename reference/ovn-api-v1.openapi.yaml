                      - infection
                      - revision
                      - complication
            specialty_ids:
              type: array
              items:
                type: string
            body_parts:
              type: array
              items:
                $ref: '#/components/schemas/BodyPart'
            offering_count:
              type: integer
            status:
              type: string
              enum:
