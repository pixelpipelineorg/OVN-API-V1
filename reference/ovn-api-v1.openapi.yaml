openapi: 3.1.0
info:
  title: OVN API
  version: 1.0.0
  summary: >-
    OrthoForum Value Network — provider directory, bundle search, and clinical
    referrals.
  description: >
    The OVN V1 API covers the full initial scope: practice and provider
    directory,

    bundle search and contracted pricing, patient registration, referral
    management,

    and webhook subscriptions.


    **Directory endpoints** — Search and browse practices, locations, providers,

    services, and bundles. No PHI; no BAA required.


    **Referral endpoints** — Register patients and submit clinical referrals.

    All referral and patient endpoints carry PHI. A signed BAA is required
    before

    access is granted. TLS 1.2+ is enforced on all PHI-carrying endpoints. Every

    mutating request requires an `Idempotency-Key` header (UUID).


    **Timeline** — Testing: November 2026. Live: January 1, 2027.


    Auth: OAuth 2.0 client credentials. Obtain a `client_id` and `client_secret`

    to generate short-lived access tokens via the token endpoint.
  contact:
    name: OVN Support
    email: help@orthoforumvaluenetwork.com
servers:
  - url: https://api.ovnapp.com/v1
    description: Production
  - url: https://sandbox-api.ovnapp.com/v1
    description: Sandbox (synthetic data, reset weekly)
security:
  - oauth2: []
tags:
  - name: Search
    description: Procedure and bundle search by ZIP code
  - name: Practices & Locations
    description: Practice and location directory
  - name: Providers
    description: Provider directory
  - name: Services & Bundles
    description: Bundle catalog and contracted pricing
  - name: Patients
    description: Patient registration (PHI; BAA required)
  - name: Referrals
    description: Referral submission and tracking (PHI; BAA required)
  - name: Webhooks
    description: Webhook subscription management
paths:
  /search/bundles:
    get:
      tags:
        - Search
      summary: Search bundles by ZIP code
      operationId: searchBundles
      description: >
        Searches for bundles/procedures within a specified radius of a ZIP code.
        All geospatial distance calculations are handled internally.
      parameters:
        - name: query
          in: query
          required: true
          description: Procedure or bundle name (e.g. "MRI", "Knee Replacement")
          schema:
            type: string
        - name: zip_code
          in: query
          required: true
          description: 5-digit US ZIP code
          schema:
            type: string
            pattern: ^\d{5}$
        - name: radius
          in: query
          description: Radius in miles (default 25)
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 200
        - name: sort
          in: query
          description: Sort results by distance or price
          schema:
            type: string
            enum:
              - distance
              - price
      responses:
        '200':
          description: Matching bundles with location and pricing context
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BundleSearchResult'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        default:
          $ref: '#/components/responses/Problem'
  /practices:
    get:
      tags:
        - Practices & Locations
      summary: List practices
      operationId: listPractices
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Paginated list of OVN practices
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Practice'
        default:
          $ref: '#/components/responses/Problem'
  /practices/{practice_id}:
    get:
      tags:
        - Practices & Locations
      summary: Retrieve a practice
      operationId: getPractice
      parameters:
        - $ref: '#/components/parameters/practice_id'
      responses:
        '200':
          description: Practice detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Practice'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /practices/{practice_id}/locations:
    get:
      tags:
        - Practices & Locations
      summary: Locations for a practice
      operationId: listPracticeLocations
      description: Lists all physical facilities for a practice.
      parameters:
        - $ref: '#/components/parameters/practice_id'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Paginated list of locations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Location'
        default:
          $ref: '#/components/responses/Problem'
  /locations/{location_id}:
    get:
      tags:
        - Practices & Locations
      summary: Retrieve a location
      operationId: getLocation
      description: Returns address, NPI, and operating hours for a specific location.
      parameters:
        - $ref: '#/components/parameters/location_id'
      responses:
        '200':
          description: Location detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /locations/{location_id}/providers:
    get:
      tags:
        - Providers
      summary: Providers at a location
      operationId: listLocationProviders
      description: Lists physicians hosted at a specific location.
      parameters:
        - $ref: '#/components/parameters/location_id'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Paginated list of providers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Provider'
        default:
          $ref: '#/components/responses/Problem'
  /providers/{provider_id}:
    get:
      tags:
        - Providers
      summary: Retrieve a provider
      operationId: getProvider
      description: Returns provider credentials, specialties, and accepted locations.
      parameters:
        - $ref: '#/components/parameters/provider_id'
      responses:
        '200':
          description: Provider detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /locations/{location_id}/services:
    get:
      tags:
        - Services & Bundles
      summary: Services offered at a location
      operationId: listLocationServices
      description: >-
        Lists individual bundle services (e.g. CPT codes or bundle names)
        offered at a location.
      parameters:
        - $ref: '#/components/parameters/location_id'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Services at this location
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Service'
        default:
          $ref: '#/components/responses/Problem'
  /bundles:
    get:
      tags:
        - Services & Bundles
      summary: List all bundles
      operationId: listBundles
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Paginated list of bundles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Bundle'
        default:
          $ref: '#/components/responses/Problem'
  /bundles/{bundle_id}/pricing:
    get:
      tags:
        - Services & Bundles
      summary: Contracted price for a bundle at a location
      operationId: getBundlePricing
      description: >
        Retrieves the exact contracted or cash price for a bundle at a specific
        facility. The `location_id` parameter is required.
      parameters:
        - $ref: '#/components/parameters/bundle_id'
        - name: location_id
          in: query
          required: true
          description: The location to retrieve pricing for
          schema:
            type: string
      responses:
        '200':
          description: Bundle pricing at the requested location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundlePrice'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /patients:
    post:
      tags:
        - Patients
      summary: Register a patient
      operationId: createPatient
      description: >
        Registers a patient in the OVN system securely before a referral is
        submitted. All fields are PHI. BAA required.
      parameters:
        - $ref: '#/components/parameters/idempotency_key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientCreate'
      responses:
        '200':
          description: Idempotent replay — patient already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '201':
          description: Patient registered; returns patient_id for use in referrals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /referrals:
    post:
      tags:
        - Referrals
      summary: Submit a referral
      operationId: createReferral
      description: >
        Submits a clinical referral for a patient to a specific
        location/provider for a specific bundle. Requires a registered
        `patient_id`. BAA required.
      parameters:
        - $ref: '#/components/parameters/idempotency_key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferralCreate'
      responses:
        '200':
          description: Idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Referral'
        '201':
          description: Referral created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Referral'
        default:
          $ref: '#/components/responses/Problem'
  /referrals/{referral_id}:
    get:
      tags:
        - Referrals
      summary: Retrieve a referral
      operationId: getReferral
      description: Fetches the current clinical and scheduling status of a referral.
      parameters:
        - $ref: '#/components/parameters/referral_id'
      responses:
        '200':
          description: Referral with current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Referral'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags:
        - Referrals
      summary: Append external tracking data
      operationId: patchReferral
      description: >
        Allows the third party to append external tracking IDs or statuses to
        the referral for cross-system syncing.
      parameters:
        - $ref: '#/components/parameters/referral_id'
        - $ref: '#/components/parameters/idempotency_key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferralPatch'
      responses:
        '200':
          description: Updated referral
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Referral'
        '409':
          description: Referral cannot be updated in its current status
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /webhooks/register:
    post:
      tags:
        - Webhooks
      summary: Register a webhook endpoint
      operationId: registerWebhook
      description: >
        Subscribes a third-party server to receive HTTP POST payloads whenever a
        referral's status changes in the OVN system, eliminating the need for
        constant polling.
      parameters:
        - $ref: '#/components/parameters/idempotency_key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRegistration'
      responses:
        '201':
          description: Webhook registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '422':
          description: Invalid URL or event type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
webhooks:
  referral.status_changed:
    post:
      summary: A referral's status has changed
      description: >
        OVN posts this to your registered endpoint whenever a referral gains a
        new status. Signed with `OVN-Signature` header
        (`t=<unix>,v1=<hmac-sha256>`). Also carries `OVN-Event` and
        `OVN-Delivery-Id`. Respond with HTTP 200 to acknowledge. OVN retries for
        24 hours on non-2xx responses.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  enum:
                    - referral.status_changed
                referral_id:
                  type: string
                partner_reference:
                  type:
                    - string
                    - 'null'
                status:
                  $ref: '#/components/schemas/ReferralStatus'
                event_id:
                  type: string
                occurred_at:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Acknowledged
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: >
        OAuth 2.0 Bearer Token. Clients obtain a `client_id` and `client_secret`
        from OVN and exchange them for short-lived access tokens. Phase II (PHI)
        endpoints enforce TLS 1.2+ and require a signed BAA before access is
        granted.
      flows:
        clientCredentials:
          tokenUrl: https://auth.ovnapp.com/oauth/token
          scopes:
            directory:read: >-
              Read Phase I directory data (practices, locations, providers,
              bundles)
            referrals:write: Create referrals and register patients (PHI; BAA required)
            referrals:read: Read referral status and history (PHI; BAA required)
  parameters:
    idempotency_key:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        UUID chosen by the caller; replays within 24 hours return the original
        response
      schema:
        type: string
        format: uuid
    practice_id:
      name: practice_id
      in: path
      required: true
      schema:
        type: string
    location_id:
      name: location_id
      in: path
      required: true
      schema:
        type: string
    provider_id:
      name: provider_id
      in: path
      required: true
      schema:
        type: string
    bundle_id:
      name: bundle_id
      in: path
      required: true
      schema:
        type: string
    referral_id:
      name: referral_id
      in: path
      required: true
      schema:
        type: string
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    cursor:
      name: cursor
      in: query
      description: Opaque cursor from a prior response's `pagination.next_cursor`
      schema:
        type: string
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Pagination:
      type: object
      required:
        - limit
        - has_more
      properties:
        limit:
          type: integer
        next_cursor:
          type:
            - string
            - 'null'
        has_more:
          type: boolean
    ListEnvelope:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
        pagination:
          $ref: '#/components/schemas/Pagination'
    Problem:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              parameter:
                type: string
              reason:
                type: string
    Address:
      type: object
      required:
        - line1
        - city
        - state
        - postal_code
      properties:
        line1:
          type: string
        line2:
          type:
            - string
            - 'null'
        city:
          type: string
        state:
          type: string
          pattern: ^[A-Z]{2}$
        postal_code:
          type: string
          pattern: ^\d{5}(-\d{4})?$
    Hours:
      type: object
      properties:
        day:
          type: string
          enum:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
        open:
          type: string
          pattern: ^\d{2}:\d{2}$
        close:
          type: string
          pattern: ^\d{2}:\d{2}$
    Practice:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        npi:
          type:
            - string
            - 'null'
          pattern: ^\d{10}$
          description: Type 2 organizational NPI
        website:
          type:
            - string
            - 'null'
          format: uri
        phone:
          type:
            - string
            - 'null'
        address:
          $ref: '#/components/schemas/Address'
        accepting_new_patients:
          type: boolean
        location_count:
          type: integer
        provider_count:
          type: integer
    Location:
      type: object
      required:
        - id
        - practice_id
        - name
        - address
      properties:
        id:
          type: string
        practice_id:
          type: string
        name:
          type: string
        npi:
          type:
            - string
            - 'null'
          pattern: ^\d{10}$
        address:
          $ref: '#/components/schemas/Address'
        phone:
          type:
            - string
            - 'null'
        fax:
          type:
            - string
            - 'null'
        hours:
          type: array
          items:
            $ref: '#/components/schemas/Hours'
        timezone:
          type: string
          example: America/Chicago
    Provider:
      type: object
      required:
        - id
        - name
        - display_name
      properties:
        id:
          type: string
        practice_id:
          type: string
        npi:
          type: string
          pattern: ^\d{10}$
          description: Type 1 individual NPI
        name:
          type: object
          required:
            - first
            - last
          properties:
            first:
              type: string
            last:
              type: string
            suffix:
              type:
                - string
                - 'null'
        display_name:
          type: string
        specialty:
          type: string
        credentials:
          type: array
          items:
            type: string
        accepting_new_patients:
          type: boolean
        photo_url:
          type:
            - string
            - 'null'
          format: uri
        bio:
          type:
            - string
            - 'null'
    Service:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        cpt_code:
          type:
            - string
            - 'null'
        bundle_name:
          type:
            - string
            - 'null'
    Bundle:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        cpt_codes:
          type: array
          items:
            type: string
        specialty:
          type: string
    BundlePrice:
      type: object
      required:
        - bundle_id
        - location_id
        - price_cents
        - currency
      properties:
        bundle_id:
          type: string
        location_id:
          type: string
        price_cents:
          type: integer
          minimum: 0
          description: Integer cents; never a float
        currency:
          type: string
          enum:
            - USD
        price_type:
          type: string
          enum:
            - contracted
            - cash
        effective_from:
          type: string
          format: date
        effective_to:
          type:
            - string
            - 'null'
          format: date
    BundleSearchResult:
      type: object
      properties:
        bundle:
          $ref: '#/components/schemas/Bundle'
        location:
          $ref: '#/components/schemas/Location'
        practice:
          $ref: '#/components/schemas/Practice'
        distance_mi:
          type: number
        price_cents:
          type:
            - integer
            - 'null'
    PatientCreate:
      type: object
      required:
        - first_name
        - last_name
        - dob
        - gender
        - contact
        - address
      description: PHI. TLS 1.2+ required. BAA required before submission.
      properties:
        first_name:
          type: string
        last_name:
          type: string
        dob:
          type: string
          format: date
          description: Date of birth
        gender:
          type: string
          enum:
            - female
            - male
            - other
            - unknown
        contact:
          type: object
          required:
            - phone
          properties:
            phone:
              type: string
              description: E.164
            email:
              type:
                - string
                - 'null'
              format: email
        address:
          $ref: '#/components/schemas/Address'
    Patient:
      allOf:
        - $ref: '#/components/schemas/PatientCreate'
        - type: object
          required:
            - patient_id
          properties:
            patient_id:
              type: string
            created_at:
              type: string
              format: date-time
    ReferralStatus:
      type: string
      enum:
        - received
        - under_review
        - needs_info
        - accepted
        - declined
        - scheduled
        - completed
        - cancelled
    ReferralCreate:
      type: object
      required:
        - patient_id
        - location_id
        - bundle_id
      description: PHI. TLS 1.2+ required. BAA required before submission.
      properties:
        patient_id:
          type: string
          description: From POST /patients
        location_id:
          type: string
        provider_id:
          type:
            - string
            - 'null'
        bundle_id:
          type: string
        partner_reference:
          type:
            - string
            - 'null'
          maxLength: 64
        notes:
          type:
            - string
            - 'null'
          maxLength: 2000
        urgency:
          type: string
          enum:
            - routine
            - urgent
          default: routine
        referring_contact:
          type: object
          required:
            - contact_name
          properties:
            contact_name:
              type: string
            contact_phone:
              type:
                - string
                - 'null'
            contact_email:
              type:
                - string
                - 'null'
              format: email
    ReferralPatch:
      type: object
      description: Append external tracking IDs or status for cross-system sync
      properties:
        external_tracking_id:
          type:
            - string
            - 'null'
          maxLength: 128
        external_status:
          type:
            - string
            - 'null'
          maxLength: 64
        notes:
          type:
            - string
            - 'null'
          maxLength: 2000
    Referral:
      allOf:
        - $ref: '#/components/schemas/ReferralCreate'
        - type: object
          required:
            - referral_id
            - status
            - created_at
            - updated_at
          properties:
            referral_id:
              type: string
            status:
              $ref: '#/components/schemas/ReferralStatus'
            assigned_practice:
              type:
                - string
                - 'null'
            assigned_location:
              type:
                - string
                - 'null'
            assigned_provider:
              type:
                - string
                - 'null'
            scheduled_at:
              type:
                - string
                - 'null'
              format: date-time
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    WebhookRegistration:
      type: object
      required:
        - url
        - events
      properties:
        url:
          type: string
          format: uri
          description: HTTPS endpoint to receive POST payloads
        events:
          type: array
