    Bundle:
      allOf:
        - $ref: '#/components/schemas/Timestamps'
        - type: object
          required:
            - id
            - code
            - version
            - name
            - anchor_procedure_id
            - setting
            - episode_window
            - components
            - status
          properties:
            id:
              type: string
              pattern: ^bnd_
            code:
              type: string
