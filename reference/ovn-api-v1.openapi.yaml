                - draft
                - retired
            effective_from:
              type:
                - string
                - 'null'
              format: date
            effective_to:
              type:
                - string
                - 'null'
              format: date
            procedures:
              type: array
              items:
                $ref: '#/components/schemas/Procedure'
              description: Only with include=procedures
