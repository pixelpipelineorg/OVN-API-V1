            version:
              type: integer
              minimum: 1
            name:
              type: string
            description:
              type: string
            anchor_procedure_id:
              type: string
            setting:
              $ref: '#/components/schemas/Setting'
            episode_window:
              type: object
              required:
                - pre_days
                - post_days
              properties:
                pre_days:
                  type: integer
                  minimum: 0
                post_days:
                  type: integer
                  minimum: 0
            components:
              type: array
              items:
                type: object
                required:
                  - kind
                  - quantity
                  - unit
                properties:
                  kind:
                    type: string
                    enum:
                      - procedure
                      - service
                  procedure_id:
                    type:
                      - string
                      - 'null'
                  service:
                    type:
                      - string
                      - 'null'
                    enum:
                      - anesthesia
                      - facility
                      - implant
                      - imaging
                      - labs
                      - pt_visits
                      - post_op_visits
                      - dme
                      - null
                  quantity:
                    type: integer
                    minimum: 1
                  unit:
                    type: string
                    enum:
                      - procedure
                      - case
                      - each
                      - study
                      - visit
                  notes:
                    type:
                      - string
                      - 'null'
            exclusions:
              type: array
              items:
                type: string
            warranty:
              type:
                - object
                - 'null'
              properties:
                days:
                  type: integer
                covers:
                  type: array
                  items:
                    type: string
                    enum:
